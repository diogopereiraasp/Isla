<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" rx="128" fill="#0a0f1d"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#1f2b45" stroke-width="12"/>
  <g transform="translate(100, 100) scale(1.2)">
    <!-- Layer group / Flashcards icon in emerald gradient -->
    <defs>
      <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#00c57c" />
        <stop offset="100%" stop-color="#059669" />
      </linearGradient>
    </defs>
    <!-- Card 1 back -->
    <rect x="40" y="20" width="180" height="110" rx="18" fill="#182238" stroke="#1f2b45" stroke-width="8"/>
    <!-- Card 2 middle -->
    <rect x="25" y="55" width="210" height="120" rx="18" fill="#131b2e" stroke="#1f2b45" stroke-width="8"/>
    <!-- Card 3 front -->
    <rect x="10" y="90" width="240" height="135" rx="18" fill="url(#emeraldGrad)" />
    <!-- Audio waves inside front card -->
    <circle cx="90" cy="157" r="14" fill="#ffffff" />
    <path d="M 125 140 Q 140 157 125 174" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" />
    <path d="M 145 130 Q 170 157 145 184" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" />
  </g>
</svg>